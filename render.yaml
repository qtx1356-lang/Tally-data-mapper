services:
  - type: web
    name: exfin-tally-audit-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXFIN_MODE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: exfin-postgres
          property: connectionString
      - key: TALLY_BRIDGE_URL
        sync: false

databases:
  - name: exfin-postgres
    plan: starter
    databaseName: exfin_audit
    user: exfin_user
